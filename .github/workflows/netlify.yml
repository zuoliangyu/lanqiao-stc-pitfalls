name: 发布到 Netlify

# GitHub Pages 直接从 master 分支的 仓库根目录 发布；这里把同一份文件同步到 Netlify（主站）。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Netlify 跑在根路径，用 _redirects 把 GitHub Pages 的 /lanqiao-stc-pitfalls/ 子路径重写到根下同名文件。
      - name: 发布到 Netlify
        run: |
          rm -rf /tmp/netlify-out && mkdir /tmp/netlify-out
          tar --exclude=./.git --exclude=./.github -cf - . | tar -xf - -C /tmp/netlify-out
          echo '/lanqiao-stc-pitfalls/*  /:splat  200' >> /tmp/netlify-out/_redirects
          npx --yes netlify-cli@26 deploy --prod --no-build --dir=/tmp/netlify-out --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
